<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Suno Song Formatter</title>
<style>
  :root {
    --bg-0: #07070a;
    --bg-1: #0e0e14;
    --bg-2: #16161f;
    --panel: #11111a;
    --panel-2: #1a1a26;
    --line: #23232f;
    --text: #ececf1;
    --muted: #8a8aa0;
    --accent: #ff3b6b;
    --accent-2: #ffb02e;
    --ok: #44d07b;
    --err: #ff5d5d;
    --mono: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg-0); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    background:
      radial-gradient(800px 500px at 85% -10%, rgba(255, 59, 107, 0.10), transparent 60%),
      radial-gradient(700px 500px at -5% 110%, rgba(255, 176, 46, 0.07), transparent 60%),
      var(--bg-0);
  }

  .shell {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 24px 80px;
  }

  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-mark {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 6px 20px rgba(255, 59, 107, 0.35);
    display: grid;
    place-items: center;
    font-weight: 800;
    color: #1a1a26;
    font-family: var(--mono);
    font-size: 18px;
  }
  .brand-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.4px;
  }
  .brand-sub {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .mode-switch {
    display: inline-flex;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 4px;
    gap: 4px;
  }
  .mode-switch button {
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 8px 14px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .mode-switch button.active {
    background: var(--panel-2);
    color: var(--text);
    box-shadow: inset 0 0 0 1px var(--line);
  }

  .grid {
    display: grid;
    grid-template-columns: minmax(340px, 1fr) minmax(420px, 1.4fr);
    gap: 22px;
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }

  .card {
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg-1) 100%);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
  }
  .card h2 {
    margin: 0 0 14px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.6px;
    color: var(--muted);
    font-weight: 700;
  }

  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 14px 0 6px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    font-weight: 600;
  }
  label:first-of-type { margin-top: 0; }

  input[type="text"], textarea, select {
    width: 100%;
    background: var(--bg-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"]:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255, 59, 107, 0.18);
  }
  textarea {
    resize: vertical;
    min-height: 80px;
    line-height: 1.5;
  }
  textarea.brain { min-height: 120px; }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .row-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 520px) {
    .row, .row-3 { grid-template-columns: 1fr; }
  }

  .pill-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .pill {
    flex: 1;
    min-width: 0;
    background: var(--bg-2);
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    font-family: inherit;
  }
  .pill:hover { color: var(--text); border-color: #34344a; }
  .pill.active {
    background: linear-gradient(135deg, rgba(255, 59, 107, 0.18), rgba(255, 176, 46, 0.12));
    border-color: var(--accent);
    color: var(--text);
    box-shadow: 0 0 0 1px var(--accent) inset, 0 0 18px rgba(255, 59, 107, 0.25);
  }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .btn {
    background: linear-gradient(135deg, var(--accent), #c92756);
    color: #fff;
    border: none;
    padding: 12px 18px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.4px;
    font-family: inherit;
    box-shadow: 0 8px 20px rgba(255, 59, 107, 0.28);
    transition: transform 0.1s, box-shadow 0.15s, opacity 0.15s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(255, 59, 107, 0.38); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn.secondary {
    background: var(--panel-2);
    border: 1px solid var(--line);
    box-shadow: none;
    color: var(--text);
  }
  .btn.secondary:hover { background: #22222e; box-shadow: none; }
  .btn.ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    box-shadow: none;
  }
  .btn.ghost:hover { color: var(--text); border-color: #34344a; box-shadow: none; }

  .api-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: end;
  }
  .api-row label { grid-column: 1 / -1; margin-bottom: 0; }
  .help {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    line-height: 1.5;
  }
  .help a { color: var(--accent-2); }

  .output-wrap {
    position: relative;
    min-height: 420px;
  }
  .output-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .output-toolbar .left {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .tab {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .tab.active { color: var(--text); border-color: var(--accent); background: rgba(255, 59, 107, 0.08); }

  .output {
    background: #08080d;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
    color: #d8d8e0;
    min-height: 380px;
    max-height: 70vh;
    overflow-y: auto;
  }
  .output:empty::before {
    content: attr(data-placeholder);
    color: var(--muted);
    font-style: italic;
  }
  .output .bracket { color: var(--accent-2); font-weight: 600; }
  .output .quote   { color: #c8e0ff; }
  .output .style-divider { color: var(--accent); font-weight: 700; }
  .output .style-prompt { color: #9be3a8; }

  .status {
    font-size: 12px;
    color: var(--muted);
    min-height: 16px;
  }
  .status.err { color: var(--err); }
  .status.ok  { color: var(--ok); }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
    vertical-align: -2px;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .counter {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  .counter.warn { color: var(--accent-2); }
  .counter.bad  { color: var(--err); }

  footer.foot {
    margin-top: 40px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }
  footer.foot a { color: var(--muted); }
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div>
        <div class="brand-title">Suno Song Formatter</div>
        <div class="brand-sub">Structured prompts for Suno AI</div>
      </div>
    </div>
    <div class="mode-switch" role="tablist" aria-label="Generation mode">
      <button id="mode-api"  class="active" data-mode="api">API</button>
      <button id="mode-copy" data-mode="copy">Copy Prompt</button>
    </div>
  </header>

  <div class="grid">
    <!-- LEFT: Form -->
    <section class="card" id="form-card">
      <h2>Song Request</h2>

      <label for="f-title">Title</label>
      <input id="f-title" type="text" placeholder="e.g. Wires in the Rain" autocomplete="off" />

      <label for="f-about">About</label>
      <textarea id="f-about" placeholder="What's the song actually about? One or two sentences."></textarea>

      <div class="row">
        <div>
          <label>Mode</label>
          <div class="pill-group" data-field="mode">
            <button class="pill active" data-value="VIRAL">Viral</button>
            <button class="pill" data-value="TRADITIONAL">Traditional</button>
            <button class="pill" data-value="EPIC">Epic</button>
          </div>
        </div>
        <div>
          <label for="f-genre">Genre</label>
          <input id="f-genre" type="text" placeholder="e.g. synthwave pop" autocomplete="off" />
        </div>
      </div>

      <div class="row">
        <div>
          <label>Voice</label>
          <div class="pill-group" data-field="voice">
            <button class="pill active" data-value="Male">Male</button>
            <button class="pill" data-value="Female">Female</button>
          </div>
        </div>
        <div>
          <label>Rhyming</label>
          <div class="pill-group" data-field="rhyming">
            <button class="pill active" data-value="OFF">Off</button>
            <button class="pill" data-value="ON">On</button>
            <button class="pill" data-value="MIXED">Mixed</button>
          </div>
        </div>
      </div>

      <label for="f-length">Target Length</label>
      <input id="f-length" type="text" placeholder="e.g. 2:00 or auto" autocomplete="off" />

      <label for="f-notes">Special Notes</label>
      <textarea id="f-notes" placeholder="Mood, references, things to avoid (optional)"></textarea>

      <label for="f-brain">Brain Dump / Lyric Ideas</label>
      <textarea id="f-brain" class="brain" placeholder="Phrases, images, story beats, anything you want included (optional)"></textarea>

      <div class="actions">
        <button id="btn-generate" class="btn">Generate Song</button>
        <button id="btn-reset" class="btn ghost" type="button">Reset</button>
      </div>
      <div id="status" class="status" style="margin-top: 10px;"></div>
    </section>

    <!-- RIGHT: Output / API settings -->
    <section class="card">
      <div class="output-toolbar">
        <div class="left">
          <button id="tab-song" class="tab active" data-tab="song">Song</button>
          <button id="tab-prompt" class="tab" data-tab="prompt">Prompt</button>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <span id="char-count" class="counter">0 chars</span>
          <button id="btn-copy" class="btn secondary" type="button">Copy</button>
        </div>
      </div>

      <div id="api-settings" style="display:none;">
        <label for="api-key">Anthropic API Key</label>
        <div class="api-row">
          <input id="api-key" type="text" placeholder="sk-ant-..." autocomplete="off" spellcheck="false" />
          <button id="btn-save-key" class="btn secondary" type="button">Save</button>
        </div>
        <div class="help">
          Stored locally in your browser only. Get one at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>.
        </div>
        <label for="model" style="margin-top: 16px;">Model</label>
        <select id="model">
          <option value="claude-sonnet-4-6">Sonnet 4.6 (balanced, default)</option>
          <option value="claude-opus-4-7">Opus 4.7 (highest quality, slower)</option>
          <option value="claude-haiku-4-5-20251001">Haiku 4.5 (fastest, cheapest)</option>
        </select>
        <hr style="border: none; border-top: 1px solid var(--line); margin: 18px 0 0;" />
      </div>

      <div class="output-wrap" style="margin-top: 14px;">
        <pre id="output" class="output" data-placeholder="Your formatted song will appear here. Fill in the form and hit Generate."></pre>
      </div>
    </section>
  </div>

  <footer class="foot">
    <span>Looking for the old Gem Merge game? <a href="gem-merge.html">It moved here.</a></span>
  </footer>
</div>

<script>
(() => {
  // ---------- The author system prompt (sent as `system` to Claude) ----------
  const SYSTEM_PROMPT = `You are a professional songwriter, lyricist, and music composer. You write all songs formatted for Suno AI.

MODES:
VIRAL — 1:30–2:30 min, 120–200 words. [Intro]>[Verse 1]>[Chorus]>[Verse 2]>[Chorus]>[Outro]. No bridge.
TRADITIONAL — 2:30–3:30 min, 180–300 words. [Intro]>[Verse 1]>[Chorus]>[Verse 2]>[Chorus]>[Bridge optional]>[Final Chorus]>[Outro]. Chorus minimum 3x.
EPIC — 5:00–7:00 min, 280–480 words. Multi-movement, interludes, mood shifts.

SUNO FORMAT:
- [ ] brackets = production instructions Suno reads but does not sing
- " " quotes = sung lyrics, open at first line and close at last line of each section
- First line always: [Style: genre, tempo, instruments, Male or Female voice, reference artists]
- Intros instrumental by default: [Intro — Instrumental, 4–8 bars]
- 6–10 words per lyric line
- Total output under 5,000 characters

WRITING RULES:
- No clichés: tapestry, echoes, beacon, realm, journey, whisper, intertwined, dance in the moonlight, in the shadows, testament, navigate
- No similes or comparative language
- Concrete, specific, emotionally direct lines only
- Rhyming OFF: natural spoken cadence, no forced end-rhymes
- Rhyming ON: clean AABB or ABAB, nothing forced
- Rhyming MIXED: only where it arises without effort

OUTPUT: Write the complete Suno-formatted song, then on a new line write exactly:
---STYLE PROMPT---
Then a style prompt under 300 characters with zero artist or band names — genre, tempo, instruments, mood, vocal style only.`;

  // ---------- State ----------
  const state = {
    mode: "api",         // "api" | "copy"
    tab: "song",         // "song" | "prompt"
    pill: { mode: "VIRAL", voice: "Male", rhyming: "OFF" },
    lastSong: "",
    lastPrompt: "",
  };

  // ---------- DOM refs ----------
  const $ = (id) => document.getElementById(id);
  const $output = $("output");
  const $status = $("status");
  const $btnGen = $("btn-generate");
  const $btnCopy = $("btn-copy");
  const $btnReset = $("btn-reset");
  const $apiSettings = $("api-settings");
  const $apiKey = $("api-key");
  const $btnSaveKey = $("btn-save-key");
  const $model = $("model");
  const $charCount = $("char-count");

  // ---------- Pill groups ----------
  document.querySelectorAll(".pill-group").forEach(group => {
    const field = group.dataset.field;
    group.addEventListener("click", (e) => {
      const pill = e.target.closest(".pill");
      if (!pill) return;
      group.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
      pill.classList.add("active");
      state.pill[field] = pill.dataset.value;
    });
  });

  // ---------- Mode switch (API vs Copy) ----------
  document.querySelectorAll(".mode-switch button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".mode-switch button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.mode = btn.dataset.mode;
      $apiSettings.style.display = state.mode === "api" ? "block" : "none";
      $btnGen.textContent = state.mode === "api" ? "Generate Song" : "Build Prompt";
      localStorage.setItem("suno.mode", state.mode);
    });
  });

  // ---------- Output tabs ----------
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      state.tab = tab.dataset.tab;
      renderOutput();
    });
  });

  // ---------- API key persistence ----------
  $btnSaveKey.addEventListener("click", () => {
    const k = $apiKey.value.trim();
    if (!k) {
      localStorage.removeItem("suno.apiKey");
      setStatus("API key cleared.", "ok");
      return;
    }
    localStorage.setItem("suno.apiKey", k);
    setStatus("API key saved locally.", "ok");
  });
  $model.addEventListener("change", () => {
    localStorage.setItem("suno.model", $model.value);
  });

  // ---------- Build the user message from the form ----------
  function readForm() {
    return {
      title:   $("f-title").value.trim(),
      about:   $("f-about").value.trim(),
      mode:    state.pill.mode,
      genre:   $("f-genre").value.trim(),
      voice:   state.pill.voice,
      rhyming: state.pill.rhyming,
      length:  $("f-length").value.trim(),
      notes:   $("f-notes").value.trim(),
      brain:   $("f-brain").value.trim(),
    };
  }

  function buildUserMessage(f) {
    return [
      "SONG REQUEST:",
      `Title: ${f.title}`,
      `About: ${f.about}`,
      `Mode: ${f.mode}`,
      `Genre: ${f.genre}`,
      `Voice: ${f.voice}`,
      `Rhyming: ${f.rhyming}`,
      `Target Length: ${f.length}`,
      `Special Notes: ${f.notes}`,
      `Brain Dump / Lyric Ideas: ${f.brain}`,
    ].join("\n");
  }

  function buildFullPrompt(f) {
    return `${SYSTEM_PROMPT}\n\n---\n\n${buildUserMessage(f)}`;
  }

  function validate(f) {
    if (!f.title) return "Title is required.";
    if (!f.about) return "Please describe what the song is about.";
    if (!f.genre) return "Genre is required.";
    return null;
  }

  // ---------- Generate ----------
  $btnGen.addEventListener("click", async () => {
    const f = readForm();
    const err = validate(f);
    if (err) { setStatus(err, "err"); return; }

    state.lastPrompt = buildFullPrompt(f);

    if (state.mode === "copy") {
      state.lastSong = "";
      state.tab = "prompt";
      document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === "prompt"));
      renderOutput();
      setStatus("Prompt built. Hit Copy and paste it into Claude, ChatGPT, or Suno.", "ok");
      return;
    }

    // API mode
    const key = localStorage.getItem("suno.apiKey") || $apiKey.value.trim();
    if (!key) { setStatus("Add your Anthropic API key first.", "err"); $apiKey.focus(); return; }

    setStatus(`<span class="spinner"></span>Calling Claude…`, "");
    $btnGen.disabled = true;
    try {
      const model = $model.value || "claude-sonnet-4-6";
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "x-api-key": key,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
          "content-type": "application/json",
        },
        body: JSON.stringify({
          model,
          max_tokens: 2000,
          system: SYSTEM_PROMPT,
          messages: [{ role: "user", content: buildUserMessage(f) }],
        }),
      });
      if (!res.ok) {
        const body = await res.text();
        let detail = body;
        try { detail = JSON.parse(body).error?.message || body; } catch {}
        throw new Error(`HTTP ${res.status}: ${detail}`);
      }
      const data = await res.json();
      const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim();
      if (!text) throw new Error("Empty response from Claude.");
      state.lastSong = text;
      state.tab = "song";
      document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === "song"));
      renderOutput();
      setStatus(`Done. ${text.length} chars · ${model}`, "ok");
    } catch (e) {
      console.error(e);
      setStatus(`Error: ${e.message || e}`, "err");
    } finally {
      $btnGen.disabled = false;
    }
  });

  // ---------- Reset ----------
  $btnReset.addEventListener("click", () => {
    $("f-title").value = "";
    $("f-about").value = "";
    $("f-genre").value = "";
    $("f-length").value = "";
    $("f-notes").value = "";
    $("f-brain").value = "";
    state.pill = { mode: "VIRAL", voice: "Male", rhyming: "OFF" };
    document.querySelectorAll(".pill-group").forEach(group => {
      const field = group.dataset.field;
      group.querySelectorAll(".pill").forEach(p => {
        p.classList.toggle("active", p.dataset.value === state.pill[field]);
      });
    });
    state.lastSong = "";
    state.lastPrompt = "";
    renderOutput();
    setStatus("Cleared.", "");
  });

  // ---------- Copy ----------
  $btnCopy.addEventListener("click", async () => {
    const text = state.tab === "song" ? state.lastSong : state.lastPrompt;
    if (!text) { setStatus("Nothing to copy yet.", "err"); return; }
    try {
      await navigator.clipboard.writeText(text);
      setStatus("Copied to clipboard.", "ok");
    } catch {
      // Fallback
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); setStatus("Copied to clipboard.", "ok"); }
      catch { setStatus("Copy failed. Select and copy manually.", "err"); }
      ta.remove();
    }
  });

  // ---------- Render output with light syntax coloring ----------
  function renderOutput() {
    const text = state.tab === "song" ? state.lastSong : state.lastPrompt;
    $charCount.textContent = `${text.length.toLocaleString()} chars`;
    $charCount.classList.toggle("warn", text.length > 4500 && text.length <= 5000);
    $charCount.classList.toggle("bad", text.length > 5000);

    if (!text) { $output.textContent = ""; return; }

    // Escape, then colorize [brackets], "quoted lines", and the style marker.
    const escaped = text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

    const parts = escaped.split(/(^---STYLE PROMPT---$)/m);
    let html = parts.map((chunk, i) => {
      if (chunk === "---STYLE PROMPT---") {
        return `<span class="style-divider">${chunk}</span>`;
      }
      // Style prompt section comes after the divider
      const isAfterDivider = i > 0 && parts[i-1] === "---STYLE PROMPT---";
      const colored = chunk
        .replace(/(\[[^\]\n]+\])/g, '<span class="bracket">$1</span>')
        .replace(/(&quot;[^&\n]*&quot;|"[^"\n]*")/g, '<span class="quote">$1</span>');
      return isAfterDivider ? `<span class="style-prompt">${colored}</span>` : colored;
    }).join("");

    $output.innerHTML = html;
  }

  function setStatus(html, kind) {
    $status.className = "status" + (kind ? " " + kind : "");
    $status.innerHTML = html;
  }

  // ---------- Restore persisted prefs ----------
  const savedMode = localStorage.getItem("suno.mode");
  if (savedMode === "copy") {
    document.querySelector('.mode-switch button[data-mode="copy"]').click();
  }
  const savedKey = localStorage.getItem("suno.apiKey");
  if (savedKey) $apiKey.value = savedKey;
  const savedModel = localStorage.getItem("suno.model");
  if (savedModel) $model.value = savedModel;
})();
</script>
</body>
</html>
